<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>小工具合集</title>
<style>
  :root {
    --ink: #1f2328;
    --ink-2: #5c6470;
    --ink-3: #98a1ad;
    --paper: #f6f4ef;
    --card: #ffffff;
    --line: #e7e3da;
    --teal: #0f766e;
    --teal-soft: #e6f2f0;
    --orange: #e8590c;
    --orange-soft: #fff0e6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--paper); }
  body {
    font-family: -apple-system, "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
    color: var(--ink);
    line-height: 1.7;
    min-height: 100vh;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 64px 20px 56px;
  }
  .head { text-align: center; margin-bottom: 44px; }
  .head .badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .12em;
    color: var(--teal);
    background: var(--teal-soft);
    border-radius: 999px;
    padding: 4px 14px;
    margin-bottom: 14px;
  }
  .head h1 { font-size: 30px; letter-spacing: .02em; margin-bottom: 8px; }
  .head p { font-size: 14px; color: var(--ink-2); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }
  .tool {
    position: relative;
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 20px;
    padding: 24px 20px 20px;
    transition: transform .15s, box-shadow .15s, border-color .15s;
  }
  .tool:hover {
    transform: translateY(-2px);
    border-color: #d8d2c4;
    box-shadow: 0 10px 28px rgba(31, 35, 40, .07);
  }
  .tool:active { transform: scale(.98); }
  .tool .t-icon {
    width: 44px; height: 44px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    margin-bottom: 14px;
  }
  .tool .t-name { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .tool .t-desc { font-size: 13px; color: var(--ink-2); line-height: 1.6; }
  .tool .t-arrow {
    position: absolute;
    top: 22px; right: 20px;
    font-size: 14px;
    color: var(--ink-3);
    transition: transform .15s, color .15s;
  }
  .tool:hover .t-arrow { transform: translateX(3px); color: var(--ink-2); }

  /* 各工具的主题色 */
  .tool.dictation .t-icon { background: var(--teal-soft); }
  .tool.wrongbook .t-icon { background: var(--orange-soft); }

  .foot {
    text-align: center;
    font-size: 12px;
    color: var(--ink-3);
    margin-top: 40px;
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="head">
    <div class="badge">TOOLS</div>
    <h1>小工具合集</h1>
    <p>打开就能用的纯静态小工具</p>
  </div>

  <div class="grid">

    <a class="tool dictation" href="./dictation/index.html">
      <span class="t-arrow">→</span>
      <div class="t-icon">✏️</div>
      <div class="t-name">默写小工具</div>
      <div class="t-desc">家长一分钟配好词库，孩子打开就能听写，支持教材版本、年级、单元选择与语速调节</div>
    </a>

    <a class="tool wrongbook" href="./wrongbook/index.html">
      <span class="t-arrow">→</span>
      <div class="t-icon">📒</div>
      <div class="t-name">错题本</div>
      <div class="t-desc">拍照框选错题，按学科、测验、标签整理，一键排版打印成 A4 重做卷</div>
    </a>

  </div>

  <div class="foot">更多小工具陆续添加中</div>

</div>

</body>
</html>
