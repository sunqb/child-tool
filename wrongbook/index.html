<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>错题本</title>
<style>
  :root {
    --ink: #1f2328;
    --ink-2: #5c6470;
    --ink-3: #98a1ad;
    --paper: #f6f4ef;
    --card: #ffffff;
    --line: #e7e3da;
    --teal: #0f766e;
    --teal-soft: #e6f2f0;
    --orange: #e8590c;
    --orange-soft: #fff0e6;
    --bad: #d6453d;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--paper); }
  body {
    font-family: -apple-system, "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
    color: var(--ink);
    line-height: 1.7;
    max-width: 480px;
    margin: 0 auto;
    padding: 16px 16px 48px;
  }

  /* 存储降级常驻提示条（架构 §4） */
  .degrade-bar {
    display: none;
    background: #fff8e6; border: 1px solid #f0e0b0; color: #8a6d1a;
    border-radius: 12px; padding: 10px 14px; font-size: 13px; margin-bottom: 12px;
  }
  .degrade-bar.show { display: block; }

  .top-bar { display: flex; justify-content: space-between; align-items: center; margin: 2px 2px 14px; }
  .top-bar .home { font-size: 13px; color: var(--ink-3); text-decoration: none; }
  .p-title { font-size: 21px; font-weight: 700; margin: 6px 2px 2px; }
  .p-sub { font-size: 13px; color: var(--ink-2); margin: 0 2px 14px; }

  .notice {
    display: none; background: #fff8e6; border: 1px solid #f0e0b0; color: #8a6d1a;
    border-radius: 12px; padding: 8px 12px; font-size: 13px; margin-bottom: 12px;
  }
  .notice.show { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .notice button { border: none; background: none; color: #8a6d1a; font-size: 13px; cursor: pointer; text-decoration: underline; font-family: inherit; }

  .card { background: var(--card); border: 1.5px solid var(--line); border-radius: var(--radius); }

  /* 筛选 */
  .filter-card { padding: 12px 14px; margin-bottom: 14px; }
  .filter-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .filter-row:last-child { margin-bottom: 0; }
  .filter-row select, .filter-row input {
    flex: 1; min-width: 0; border: 1.5px solid var(--line); border-radius: 10px;
    padding: 8px 10px; font-size: 14px; font-family: inherit; background: #fff; color: var(--ink);
  }
  .filter-row .f-label { flex: none; align-self: center; font-size: 12px; color: var(--ink-3); width: 34px; }

  /* 列表操作 */
  .list-actions { display: flex; gap: 8px; margin-bottom: 12px; }
  .btn {
    border: 1.5px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 12px; padding: 9px 12px; font-size: 14px; cursor: pointer; font-family: inherit;
    min-height: 44px;
  }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; font-weight: 600; }
  .btn.orange { background: var(--orange); border-color: var(--orange); color: #fff; font-weight: 600; }
  .btn.on { border-color: var(--teal); background: var(--teal-soft); color: var(--teal); font-weight: 600; }
  .btn.flex-1 { flex: 1; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  /* 状态区：加载 / 失败 / 空 */
  .status-box { text-align: center; padding: 36px 16px; color: var(--ink-3); font-size: 14px; }
  .status-box .s-big { font-size: 34px; margin-bottom: 8px; }
  .status-box .btn { margin-top: 12px; }

  /* 错题卡片 */
  .q-card {
    display: flex; gap: 12px; background: var(--card);
    border: 1.5px solid var(--line); border-radius: var(--radius);
    padding: 10px; margin-bottom: 10px; cursor: pointer; position: relative;
    transition: border-color .15s;
  }
  .q-card.selected { border-color: var(--teal); background: var(--teal-soft); }
  .q-thumb {
    width: 88px; height: 88px; border-radius: 10px; object-fit: cover;
    background: #f0eee8; flex: none;
  }
  .q-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .q-line1 { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
  .q-subject {
    flex: none; font-size: 11px; font-weight: 600; padding: 1px 8px;
    border-radius: 999px; background: var(--teal-soft); color: var(--teal);
  }
  .q-date { font-size: 12px; color: var(--ink-3); }
  .q-exam { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .q-note { font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .q-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; padding-top: 4px; }
  .q-tag { font-size: 11px; padding: 0 8px; border-radius: 999px; background: var(--orange-soft); color: var(--orange); }
  .q-check {
    position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 50%;
    border: 1.5px solid var(--line); background: #fff; display: none;
    align-items: center; justify-content: center; font-size: 13px; color: #fff;
  }
  .select-mode .q-check { display: flex; }
  .select-mode .q-card.selected .q-check { background: var(--teal); border-color: var(--teal); }

  /* 底部管理区 */
  .manage { display: flex; gap: 8px; margin-top: 18px; }
  .manage .btn { flex: 1; font-size: 13px; padding: 9px 4px; }

  /* 弹层 */
  .sheet-mask {
    position: fixed; inset: 0; background: rgba(31,35,40,.4); display: none; z-index: 50;
  }
  .sheet-mask.show { display: block; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; background: #fff;
    border-radius: 20px 20px 0 0; padding: 18px 16px 28px; z-index: 51;
    transform: translateY(105%); transition: transform .2s ease;
    max-width: 480px; margin: 0 auto; max-height: 86vh; overflow-y: auto;
  }
  .sheet-mask.show .sheet { transform: translateY(0); }
  .sheet h4 { font-size: 16px; text-align: center; margin-bottom: 14px; font-weight: 700; }
  .sheet .f-field { margin-bottom: 12px; }
  .sheet .f-field label { display: block; font-size: 13px; color: var(--ink-2); margin-bottom: 4px; }
  .sheet .f-field input, .sheet .f-field select, .sheet .f-field textarea {
    width: 100%; border: 1.5px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font-size: 15px; font-family: inherit; background: #fff; color: var(--ink);
  }
  .sheet .f-field textarea { resize: vertical; min-height: 60px; }
  .sheet-close {
    display: block; width: 100%; border: none; background: none; color: var(--ink-3);
    font-size: 14px; padding: 10px; font-family: inherit; cursor: pointer;
  }
  .detail-img { width: 100%; border-radius: 10px; background: #f0eee8; margin-bottom: 12px; }

  .seg { display: flex; background: #f0eee8; border-radius: 12px; padding: 3px; gap: 3px; }
  .seg button {
    flex: 1; border: none; background: transparent; padding: 9px 4px; border-radius: 9px;
    font-size: 14px; color: var(--ink-2); cursor: pointer; font-family: inherit;
  }
  .seg button.on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.08); }

  .row-line { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); gap: 10px; }
  .row-line:last-child { border-bottom: none; }
  .row-line .r-label { font-size: 14px; }
  .row-line .r-hint { font-size: 12px; color: var(--ink-3); }

  .switch { width: 46px; height: 27px; border-radius: 999px; background: #d8d4cb; position: relative; cursor: pointer; transition: background .2s; flex: none; }
  .switch::after {
    content: ""; position: absolute; top: 2.5px; left: 3px; width: 22px; height: 22px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: left .2s;
  }
  .switch.on { background: var(--teal); }
  .switch.on::after { left: 21px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 7px 12px; border-radius: 999px; border: 1.5px solid var(--line);
    background: #fff; font-size: 14px; color: var(--ink-2); cursor: pointer; user-select: none;
    font-family: inherit; display: inline-flex; align-items: center; gap: 6px;
  }
  .chip .chip-x { color: var(--ink-3); font-size: 13px; padding: 0 2px; }
  .add-row { display: flex; gap: 8px; margin-top: 12px; }
  .add-row input {
    flex: 1; border: 1.5px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font-size: 15px; font-family: inherit;
  }

  .toast {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(20px);
    background: rgba(31,35,40,.92); color: #fff; font-size: 14px; padding: 10px 18px;
    border-radius: 999px; opacity: 0; pointer-events: none; transition: all .2s; z-index: 90;
    max-width: 86vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- 打印区（架构 §6） ---------- */
  #print-sheet { display: none; }

  @media print {
    @page { size: A4 portrait; margin: 12mm; }
    body { background: #fff; max-width: none; padding: 0; }
    body > *:not(#print-sheet) { display: none !important; }
    #print-sheet { display: block; color: #000; }
  }

  #print-sheet .pq-grid { display: grid; gap: 6mm; }
  #print-sheet.per-1 .pq-grid { grid-template-columns: 1fr; }
  #print-sheet.per-2 .pq-grid { grid-template-columns: 1fr; }
  #print-sheet.per-4 .pq-grid { grid-template-columns: 1fr 1fr; }

  #print-sheet .pq { border: none; break-inside: avoid; page-break-inside: avoid; }
  #print-sheet .pq-head { font-size: 13px; font-weight: 700; margin-bottom: 2mm; }
  #print-sheet .pq-img-wrap { text-align: center; }
  #print-sheet .pq img { max-width: 100%; }
  #print-sheet.per-1 .pq img { max-height: 22cm; }
  #print-sheet.per-2 .pq img { max-height: 12cm; }
  #print-sheet.per-4 .pq img { max-height: 8cm; }
  #print-sheet .pq-meta { font-size: 11px; color: #444; margin-top: 2mm; }
  #print-sheet .pq-tags { font-size: 11px; color: #444; margin-top: 1mm; }
  #print-sheet .pq-blank { width: 100%; }
</style>
</head>
<body>

<div id="degrade-bar" class="degrade-bar">本地存储不可用，数据关闭页面后将丢失，请及时导出备份</div>

<div class="top-bar">
  <a class="home" href="../index.html">← 小工具合集</a>
  <a class="btn primary" style="text-decoration:none; display:inline-flex; align-items:center; min-height:36px; padding:6px 14px;" href="capture.html">+ 录错题</a>
</div>

<h1 class="p-title">错题本</h1>
<p class="p-sub">共 <b id="total-count">0</b> 道错题 · 数据只保存在本机</p>

<div id="backup-hint" class="notice"><span>错题数据只存在本机浏览器里，建议定期导出备份</span><button id="backup-hint-ok">知道了</button></div>

<div class="card filter-card">
  <div class="filter-row">
    <span class="f-label">学科</span>
    <select id="f-subject"><option value="">全部学科</option></select>
    <span class="f-label">测验</span>
    <select id="f-exam"><option value="">全部测验</option></select>
  </div>
  <div class="filter-row">
    <span class="f-label">标签</span>
    <select id="f-tag"><option value="">全部标签</option></select>
  </div>
  <div class="filter-row">
    <span class="f-label">日期</span>
    <input type="date" id="f-from" aria-label="开始日期">
    <input type="date" id="f-to" aria-label="结束日期">
  </div>
</div>

<div class="list-actions">
  <button class="btn" id="btn-select-mode">选择</button>
  <button class="btn flex-1" id="btn-print-filter">打印当前筛选</button>
  <button class="btn orange flex-1" id="btn-print-selected" hidden>打印选中（0）</button>
</div>
<div id="iphone-hint" class="notice"><span>打印请在电脑端打开本页</span></div>

<div id="list-status" class="status-box" hidden></div>
<div id="card-list"></div>

<div class="manage">
  <button class="btn" id="btn-print-settings">打印设置</button>
  <button class="btn" id="btn-subjects">学科管理</button>
  <button class="btn" id="btn-export">导出备份</button>
  <button class="btn" id="btn-import">导入备份</button>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
</div>

<!-- 详情 / 编辑弹层 -->
<div class="sheet-mask" id="detail-mask">
  <div class="sheet">
    <h4>错题详情</h4>
    <img class="detail-img" id="d-img" alt="错题图片">
    <div class="f-field"><label>学科</label><select id="d-subject"></select></div>
    <div class="f-field"><label>所属测验</label><input id="d-exam" list="d-exam-list" placeholder="如：四年级上册 第3单元测验"><datalist id="d-exam-list"></datalist></div>
    <div class="f-field"><label>日期</label><input type="date" id="d-date"></div>
    <div class="f-field"><label>标签</label>
      <div class="chips" id="d-tags"></div>
      <div class="add-row"><input id="d-tag-input" list="d-tag-list" placeholder="输入标签，回车添加"><datalist id="d-tag-list"></datalist><button class="btn" id="d-tag-add">添加</button></div>
    </div>
    <div class="f-field"><label>备注</label><textarea id="d-note" placeholder="可选"></textarea></div>
    <button class="btn primary" id="d-save" style="width:100%; margin-bottom:8px;">保存修改</button>
    <button class="btn" id="d-delete" style="width:100%; color:var(--bad); margin-bottom:4px;">删除这道错题</button>
    <button class="sheet-close" id="d-close">关闭</button>
  </div>
</div>

<!-- 打印设置弹层 -->
<div class="sheet-mask" id="ps-mask">
  <div class="sheet">
    <h4>打印设置</h4>
    <div class="f-field"><label>每页题数</label>
      <div class="seg" id="ps-perpage">
        <button data-v="1">1 题</button><button data-v="2">2 题</button><button data-v="4">4 题</button>
      </div>
    </div>
    <div class="f-field"><label>每题下方留白（供手写重做）</label>
      <div class="seg" id="ps-blank">
        <button data-v="0">无</button><button data-v="3">3cm</button><button data-v="6">6cm</button><button data-v="9">9cm</button>
      </div>
    </div>
    <div class="row-line"><span class="r-label">显示标签</span><span class="r-hint">打印每题的标签</span><span class="switch" id="ps-showtags"></span></div>
    <div class="row-line"><span class="r-label">显示学科·测验·日期</span><span class="r-hint">打印元信息行</span><span class="switch" id="ps-showmeta"></span></div>
    <button class="sheet-close" id="ps-close">完成</button>
  </div>
</div>

<!-- 学科管理弹层 -->
<div class="sheet-mask" id="sub-mask">
  <div class="sheet">
    <h4>学科管理</h4>
    <p style="font-size:12px;color:var(--ink-3);margin-bottom:10px;">内置 语文 / 数学 / 英语，可添加自定义学科；学科下还有错题时不能删除。</p>
    <div class="chips" id="sub-list"></div>
    <div class="add-row"><input id="sub-input" placeholder="新学科名称，如：科学"><button class="btn primary" id="sub-add">添加</button></div>
    <button class="sheet-close" id="sub-close">完成</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 打印区：仅打印时可见（架构 §6） -->
<div id="print-sheet"></div>

<script src="js/store.js"></script>
<script>
(function () {
  "use strict";

  var els = {
    degradeBar: document.getElementById("degrade-bar"),
    totalCount: document.getElementById("total-count"),
    backupHint: document.getElementById("backup-hint"),
    fSubject: document.getElementById("f-subject"),
    fExam: document.getElementById("f-exam"),
    fTag: document.getElementById("f-tag"),
    fFrom: document.getElementById("f-from"),
    fTo: document.getElementById("f-to"),
    btnSelectMode: document.getElementById("btn-select-mode"),
    btnPrintFilter: document.getElementById("btn-print-filter"),
    btnPrintSelected: document.getElementById("btn-print-selected"),
    iphoneHint: document.getElementById("iphone-hint"),
    listStatus: document.getElementById("list-status"),
    cardList: document.getElementById("card-list"),
    btnPrintSettings: document.getElementById("btn-print-settings"),
    btnSubjects: document.getElementById("btn-subjects"),
    btnExport: document.getElementById("btn-export"),
    btnImport: document.getElementById("btn-import"),
    importFile: document.getElementById("import-file"),
    printSheet: document.getElementById("print-sheet"),
    toast: document.getElementById("toast")
  };

  var state = {
    metas: [],           // 当前筛选结果（按 date desc）
    loading: false,
    error: null,
    selectMode: false,
    selected: {},        // id -> true
    thumbs: {},          // id -> objectURL（列表缩略图缓存）
    detailId: null,
    detailTags: [],
    backupHintShown: false
  };

  var isIphone = /iP(hone|od)/.test(navigator.userAgent) && !/iPad/.test(navigator.userAgent);

  function toast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { els.toast.classList.remove("show"); }, 2200);
  }

  /* ---------- 存储降级提示 ---------- */

  function showDegrade() { els.degradeBar.classList.add("show"); }
  if (Store.storage.degraded()) showDegrade();
  Store.storage.onDegrade(showDegrade);

  /* ---------- 筛选 ---------- */

  function currentFilter() {
    return {
      subject: els.fSubject.value || undefined,
      exam: els.fExam.value || undefined,
      tag: els.fTag.value || undefined,
      from: els.fFrom.value || undefined,
      to: els.fTo.value || undefined
    };
  }

  function fillSelect(select, list, allLabel, current) {
    select.textContent = "";
    var opt = document.createElement("option");
    opt.value = ""; opt.textContent = allLabel;
    select.appendChild(opt);
    list.forEach(function (v) {
      var o = document.createElement("option");
      o.value = v; o.textContent = v;
      select.appendChild(o);
    });
    if (current && list.indexOf(current) >= 0) select.value = current;
  }

  function refreshFilterOptions() {
    var subjects = Store.subjects.get();
    fillSelect(els.fSubject, subjects, "全部学科", els.fSubject.value);
    var subj = els.fSubject.value || undefined;
    return Store.questions.distinctExams(subj).then(function (r) {
      if (r.ok) fillSelect(els.fExam, r.exams, "全部测验", els.fExam.value);
      return Store.questions.distinctTags(subj);
    }).then(function (r) {
      if (r.ok) fillSelect(els.fTag, r.tags, "全部标签", els.fTag.value);
    });
  }

  /* ---------- 列表 ---------- */

  function revokeThumb(id) {
    if (state.thumbs[id]) { URL.revokeObjectURL(state.thumbs[id]); delete state.thumbs[id]; }
  }

  function setStatus(kind, msg) {
    els.listStatus.hidden = kind === "hide";
    els.cardList.hidden = kind !== "hide";
    if (kind === "hide") return;
    els.listStatus.textContent = "";
    var big = document.createElement("div");
    big.className = "s-big";
    big.textContent = kind === "loading" ? "…" : (kind === "error" ? "⚠️" : "📒");
    els.listStatus.appendChild(big);
    var p = document.createElement("div");
    p.textContent = msg;
    els.listStatus.appendChild(p);
    if (kind === "error") {
      var btn = document.createElement("button");
      btn.className = "btn";
      btn.textContent = "重试";
      btn.addEventListener("click", loadList);
      els.listStatus.appendChild(btn);
    }
    if (kind === "empty") {
      var a = document.createElement("a");
      a.className = "btn primary";
      a.href = "capture.html";
      a.textContent = "去拍第一张试卷";
      a.style.display = "inline-block";
      a.style.marginTop = "12px";
      a.style.textDecoration = "none";
      els.listStatus.appendChild(a);
    }
  }

  function makeCard(meta) {
    var card = document.createElement("div");
    card.className = "q-card";
    if (state.selected[meta.id]) card.classList.add("selected");

    var img = document.createElement("img");
    img.className = "q-thumb";
    img.alt = "错题缩略图";
    card.appendChild(img);
    if (state.thumbs[meta.id]) {
      img.src = state.thumbs[meta.id];
    } else {
      Store.questions.get(meta.id).then(function (r) {
        if (r.ok && r.blob && card.isConnected) {
          var url = URL.createObjectURL(r.blob);
          state.thumbs[meta.id] = url;
          img.src = url;
        }
      });
    }

    var info = document.createElement("div");
    info.className = "q-info";

    var line1 = document.createElement("div");
    line1.className = "q-line1";
    var subj = document.createElement("span");
    subj.className = "q-subject";
    subj.textContent = meta.subject || "未分学科";
    var date = document.createElement("span");
    date.className = "q-date";
    date.textContent = meta.date || "";
    line1.appendChild(subj);
    line1.appendChild(date);
    info.appendChild(line1);

    var exam = document.createElement("div");
    exam.className = "q-exam";
    exam.textContent = meta.exam || "（未填写测验名）";
    info.appendChild(exam);

    if (meta.note) {
      var note = document.createElement("div");
      note.className = "q-note";
      note.textContent = meta.note;
      info.appendChild(note);
    }

    if (meta.tags && meta.tags.length) {
      var tags = document.createElement("div");
      tags.className = "q-tags";
      meta.tags.forEach(function (t) {
        var tag = document.createElement("span");
        tag.className = "q-tag";
        tag.textContent = t;
        tags.appendChild(tag);
      });
      info.appendChild(tags);
    }
    card.appendChild(info);

    var check = document.createElement("span");
    check.className = "q-check";
    check.textContent = "✓";
    card.appendChild(check);

    card.addEventListener("click", function () {
      if (state.selectMode) {
        if (state.selected[meta.id]) delete state.selected[meta.id];
        else state.selected[meta.id] = true;
        card.classList.toggle("selected", !!state.selected[meta.id]);
        updateSelectedUI();
      } else {
        openDetail(meta.id);
      }
    });
    return card;
  }

  function renderList() {
    els.cardList.textContent = "";
    els.totalCount.textContent = String(state.metas.length);
    if (!state.metas.length) {
      setStatus("empty", "还没有错题，拍照框选即可收录");
      return;
    }
    setStatus("hide");
    state.metas.forEach(function (meta) {
      els.cardList.appendChild(makeCard(meta));
    });
  }

  function loadList() {
    state.loading = true;
    state.error = null;
    setStatus("loading", "加载中…");
    return Store.questions.list(currentFilter()).then(function (r) {
      state.loading = false;
      if (!r.ok) {
        state.error = r.error || "加载失败";
        setStatus("error", "错题列表加载失败，请重试");
        return;
      }
      state.metas = r.metas;
      renderList();
      if (r.metas.length && !state.backupHintShown) {
        state.backupHintShown = true;
        els.backupHint.classList.add("show");
      }
    });
  }

  /* ---------- 选择模式 ---------- */

  function updateSelectedUI() {
    var n = Object.keys(state.selected).length;
    els.btnPrintSelected.hidden = n === 0;
    els.btnPrintSelected.textContent = "打印选中（" + n + "）";
  }

  els.btnSelectMode.addEventListener("click", function () {
    state.selectMode = !state.selectMode;
    els.btnSelectMode.classList.toggle("on", state.selectMode);
    els.btnSelectMode.textContent = state.selectMode ? "完成" : "选择";
    document.body.classList.toggle("select-mode", state.selectMode);
    if (!state.selectMode) {
      state.selected = {};
      updateSelectedUI();
      renderList();
    }
  });

  /* ---------- 详情 / 编辑 ---------- */

  var dEls = {
    mask: document.getElementById("detail-mask"),
    img: document.getElementById("d-img"),
    subject: document.getElementById("d-subject"),
    exam: document.getElementById("d-exam"),
    date: document.getElementById("d-date"),
    tags: document.getElementById("d-tags"),
    tagInput: document.getElementById("d-tag-input"),
    tagAdd: document.getElementById("d-tag-add"),
    note: document.getElementById("d-note"),
    save: document.getElementById("d-save"),
    del: document.getElementById("d-delete"),
    close: document.getElementById("d-close"),
    examList: document.getElementById("d-exam-list"),
    tagList: document.getElementById("d-tag-list")
  };

  function fillDatalist(dl, list) {
    dl.textContent = "";
    list.forEach(function (v) {
      var o = document.createElement("option");
      o.value = v;
      dl.appendChild(o);
    });
  }

  function fillSubjectSelect(select, current) {
    select.textContent = "";
    Store.subjects.get().forEach(function (s) {
      var o = document.createElement("option");
      o.value = s; o.textContent = s;
      select.appendChild(o);
    });
    if (current) select.value = current;
    if (!select.value && select.options.length) select.selectedIndex = 0;
  }

  function renderDetailTags() {
    dEls.tags.textContent = "";
    state.detailTags.forEach(function (t, i) {
      var chip = document.createElement("span");
      chip.className = "chip";
      var name = document.createElement("span");
      name.textContent = t;
      var x = document.createElement("span");
      x.className = "chip-x";
      x.textContent = "×";
      x.addEventListener("click", function () {
        state.detailTags.splice(i, 1);
        renderDetailTags();
      });
      chip.appendChild(name);
      chip.appendChild(x);
      dEls.tags.appendChild(chip);
    });
    if (!state.detailTags.length) {
      var empty = document.createElement("span");
      empty.style.cssText = "font-size:12px;color:var(--ink-3);";
      empty.textContent = "暂无标签";
      dEls.tags.appendChild(empty);
    }
  }

  function addDetailTag() {
    var v = dEls.tagInput.value.trim();
    if (!v) return;
    if (state.detailTags.indexOf(v) < 0) state.detailTags.push(v);
    dEls.tagInput.value = "";
    renderDetailTags();
  }

  dEls.tagAdd.addEventListener("click", addDetailTag);
  dEls.tagInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); addDetailTag(); }
  });

  function openDetail(id) {
    Store.questions.get(id).then(function (r) {
      if (!r.ok || !r.meta) { toast("加载详情失败"); return; }
      state.detailId = id;
      state.detailTags = r.meta.tags.slice();
      if (r.blob) dEls.img.src = URL.createObjectURL(r.blob);
      fillSubjectSelect(dEls.subject, r.meta.subject);
      dEls.exam.value = r.meta.exam || "";
      dEls.date.value = r.meta.date || "";
      dEls.note.value = r.meta.note || "";
      fillDatalist(dEls.examList, Store.hints.exams());
      fillDatalist(dEls.tagList, Store.hints.tags());
      renderDetailTags();
      dEls.mask.classList.add("show");
    });
  }

  function closeDetail() {
    if (dEls.img.src) URL.revokeObjectURL(dEls.img.src);
    dEls.img.removeAttribute("src");
    dEls.mask.classList.remove("show");
    state.detailId = null;
  }

  dEls.close.addEventListener("click", closeDetail);
  dEls.mask.addEventListener("click", function (e) { if (e.target === dEls.mask) closeDetail(); });

  dEls.save.addEventListener("click", function () {
    if (!state.detailId) return;
    var partial = {
      subject: dEls.subject.value,
      exam: dEls.exam.value.trim(),
      date: dEls.date.value,
      tags: state.detailTags.slice(),
      note: dEls.note.value.trim()
    };
    if (!partial.subject) { toast("请选择学科"); return; }
    Store.questions.update(state.detailId, partial).then(function (r) {
      if (!r.ok) { toast("保存失败，请重试"); return; }
      if (partial.exam) Store.hints.addExam(partial.exam);
      if (partial.tags.length) Store.hints.addTags(partial.tags);
      closeDetail();
      refreshFilterOptions().then(loadList);
      toast("已保存");
    });
  });

  dEls.del.addEventListener("click", function () {
    if (!state.detailId) return;
    if (!confirm("确定删除这道错题吗？删除后不可恢复。")) return;
    Store.questions.remove(state.detailId).then(function (r) {
      if (!r.ok) { toast("删除失败，请重试"); return; }
      revokeThumb(state.detailId);
      closeDetail();
      refreshFilterOptions().then(loadList);
      toast("已删除");
    });
  });

  /* ---------- 打印 ---------- */

  var psEls = {
    mask: document.getElementById("ps-mask"),
    perpage: document.getElementById("ps-perpage"),
    blank: document.getElementById("ps-blank"),
    showtags: document.getElementById("ps-showtags"),
    showmeta: document.getElementById("ps-showmeta"),
    close: document.getElementById("ps-close")
  };

  function syncPrintSettingsUI() {
    var s = Store.printSettings.get();
    Array.prototype.forEach.call(psEls.perpage.children, function (b) {
      b.classList.toggle("on", Number(b.dataset.v) === s.perPage);
    });
    Array.prototype.forEach.call(psEls.blank.children, function (b) {
      b.classList.toggle("on", Number(b.dataset.v) === s.blankCm);
    });
    psEls.showtags.classList.toggle("on", s.showTags);
    psEls.showmeta.classList.toggle("on", s.showMeta);
  }

  psEls.perpage.addEventListener("click", function (e) {
    var v = e.target.dataset && e.target.dataset.v;
    if (v) { Store.printSettings.set({ perPage: Number(v) }); syncPrintSettingsUI(); }
  });
  psEls.blank.addEventListener("click", function (e) {
    var v = e.target.dataset && e.target.dataset.v;
    if (v) { Store.printSettings.set({ blankCm: Number(v) }); syncPrintSettingsUI(); }
  });
  psEls.showtags.addEventListener("click", function () {
    Store.printSettings.set({ showTags: !Store.printSettings.get().showTags });
    syncPrintSettingsUI();
  });
  psEls.showmeta.addEventListener("click", function () {
    Store.printSettings.set({ showMeta: !Store.printSettings.get().showMeta });
    syncPrintSettingsUI();
  });
  els.btnPrintSettings.addEventListener("click", function () {
    syncPrintSettingsUI();
    psEls.mask.classList.add("show");
  });
  psEls.close.addEventListener("click", function () { psEls.mask.classList.remove("show"); });
  psEls.mask.addEventListener("click", function (e) { if (e.target === psEls.mask) psEls.mask.classList.remove("show"); });

  // iPhone/iPod Safari 不支持 window.print()（架构 §6）
  if (isIphone) {
    els.iphoneHint.classList.add("show");
    els.btnPrintFilter.disabled = true;
    els.btnPrintSelected.disabled = true;
  }

  function buildPrintSheet(metas) {
    var s = Store.printSettings.get();
    var sheet = els.printSheet;
    sheet.className = "per-" + s.perPage;
    sheet.textContent = "";
    var grid = document.createElement("div");
    grid.className = "pq-grid";
    sheet.appendChild(grid);

    var urls = [];
    var decoders = [];
    var chain = Promise.resolve();
    metas.forEach(function (meta, idx) {
      chain = chain.then(function () {
        return Store.questions.get(meta.id).then(function (r) {
          if (!r.ok || !r.blob) return;
          var url = URL.createObjectURL(r.blob);
          urls.push(url);

          var pq = document.createElement("div");
          pq.className = "pq";

          var head = document.createElement("div");
          head.className = "pq-head";
          head.textContent = "第 " + (idx + 1) + " 题";
          pq.appendChild(head);

          var wrap = document.createElement("div");
          wrap.className = "pq-img-wrap";
          var img = document.createElement("img");
          img.src = url;
          img.alt = "错题图片";
          decoders.push(img.decode ? img.decode().catch(function () {}) : Promise.resolve());
          wrap.appendChild(img);
          pq.appendChild(wrap);

          if (s.showMeta) {
            var metaLine = document.createElement("div");
            metaLine.className = "pq-meta";
            metaLine.textContent = meta.subject + " · " + (meta.exam || "未填写测验") + " · " + meta.date;
            pq.appendChild(metaLine);
          }
          if (s.showTags && meta.tags && meta.tags.length) {
            var tagLine = document.createElement("div");
            tagLine.className = "pq-tags";
            tagLine.textContent = "标签：" + meta.tags.join("、");
            pq.appendChild(tagLine);
          }
          if (s.blankCm > 0) {
            var blank = document.createElement("div");
            blank.className = "pq-blank";
            blank.style.height = s.blankCm + "cm";
            pq.appendChild(blank);
          }
          grid.appendChild(pq);
        });
      });
    });
    return chain.then(function () { return Promise.all(decoders); }).then(function () { return urls; });
  }

  function doPrint(metas) {
    if (!metas.length) { toast("没有可打印的错题"); return; }
    if (isIphone) { toast("打印请在电脑端打开本页"); return; }
    buildPrintSheet(metas).then(function (urls) {
      var cleanup = function () {
        els.printSheet.textContent = "";
        urls.forEach(function (u) { URL.revokeObjectURL(u); });
        globalThis.removeEventListener("afterprint", cleanup);
      };
      globalThis.addEventListener("afterprint", cleanup);
      window.print();
    });
  }

  els.btnPrintFilter.addEventListener("click", function () { doPrint(state.metas); });
  els.btnPrintSelected.addEventListener("click", function () {
    var picked = state.metas.filter(function (m) { return state.selected[m.id]; });
    doPrint(picked);
  });

  /* ---------- 备份 ---------- */

  els.btnExport.addEventListener("click", function () {
    Store.backup.export().then(function (r) {
      toast(r.ok ? "备份文件已开始下载" : "导出失败：" + (r.error || "未知错误"));
    });
  });

  els.btnImport.addEventListener("click", function () { els.importFile.click(); });
  els.importFile.addEventListener("change", function () {
    var f = els.importFile.files && els.importFile.files[0];
    els.importFile.value = "";
    if (!f) return;
    if (!confirm("导入将全量覆盖当前错题本（已自动导出一份导入前备份）。确定继续吗？")) return;
    Store.backup.import(f).then(function (r) {
      if (!r.ok) { toast("导入失败：" + (r.error || "未知错误")); return; }
      Object.keys(state.thumbs).forEach(revokeThumb);
      state.selected = {};
      updateSelectedUI();
      refreshFilterOptions().then(loadList).then(function () {
        toast("导入完成：成功 " + r.imported + " 题" + (r.skipped ? "，跳过 " + r.skipped + " 题" : ""));
      });
    });
  });

  document.getElementById("backup-hint-ok").addEventListener("click", function () {
    els.backupHint.classList.remove("show");
  });

  /* ---------- 学科管理 ---------- */

  var subEls = {
    mask: document.getElementById("sub-mask"),
    list: document.getElementById("sub-list"),
    input: document.getElementById("sub-input"),
    add: document.getElementById("sub-add"),
    close: document.getElementById("sub-close")
  };

  function renderSubjects() {
    subEls.list.textContent = "";
    Store.subjects.get().forEach(function (s) {
      var chip = document.createElement("span");
      chip.className = "chip";
      var name = document.createElement("span");
      name.textContent = s;
      chip.appendChild(name);
      if (["语文", "数学", "英语"].indexOf(s) < 0) {
        var x = document.createElement("span");
        x.className = "chip-x";
        x.textContent = "×";
        x.addEventListener("click", function () {
          if (!confirm("确定删除学科「" + s + "」吗？")) return;
          Store.subjects.remove(s).then(function (r) {
            if (!r.ok && r.reason === "in-use") { toast("该学科下还有错题，不能删除"); return; }
            if (!r.ok) { toast("删除失败，请重试"); return; }
            renderSubjects();
            refreshFilterOptions();
          });
        });
        chip.appendChild(x);
      }
      subEls.list.appendChild(chip);
    });
  }

  function addSubject() {
    var v = subEls.input.value.trim();
    if (!v) return;
    var r = Store.subjects.add(v);
    if (!r.ok) { toast("添加失败"); return; }
    subEls.input.value = "";
    renderSubjects();
    refreshFilterOptions();
  }

  subEls.add.addEventListener("click", addSubject);
  subEls.input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); addSubject(); }
  });
  els.btnSubjects.addEventListener("click", function () {
    renderSubjects();
    subEls.mask.classList.add("show");
  });
  subEls.close.addEventListener("click", function () { subEls.mask.classList.remove("show"); });
  subEls.mask.addEventListener("click", function (e) { if (e.target === subEls.mask) subEls.mask.classList.remove("show"); });

  /* ---------- 筛选事件 ---------- */

  [els.fExam, els.fTag, els.fFrom, els.fTo].forEach(function (el) {
    el.addEventListener("change", function () { loadList(); });
  });
  // 学科变化时先同步重置联动的测验/标签筛选，再刷新列表（顺序不能反，否则列表吃到旧筛选值）
  els.fSubject.addEventListener("change", function () {
    els.fExam.value = "";
    els.fTag.value = "";
    Store.questions.distinctExams(els.fSubject.value || undefined).then(function (r) {
      if (r.ok) fillSelect(els.fExam, r.exams, "全部测验", "");
    });
    Store.questions.distinctTags(els.fSubject.value || undefined).then(function (r) {
      if (r.ok) fillSelect(els.fTag, r.tags, "全部标签", "");
    });
    loadList();
  });

  /* ---------- 启动 ---------- */

  refreshFilterOptions().then(loadList);
})();
</script>
</body>
</html>
