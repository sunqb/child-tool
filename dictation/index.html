<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>默写小工具</title>
<style>
  :root {
    --ink: #1f2328;
    --ink-2: #5c6470;
    --paper: #f6f4ef;
    --accent: #0f766e;
    --accent-soft: #e6f2f0;
    --kid: #e8590c;
    --kid-soft: #fff0e6;
    --line: #e7e3da;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--paper); }
  body {
    font-family: -apple-system, "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
    color: var(--ink);
    line-height: 1.7;
    max-width: 480px;
    margin: 0 auto;
    padding: 56px 20px 48px;
  }
  .head { text-align: center; margin-bottom: 36px; }
  .head h1 { font-size: 26px; letter-spacing: .02em; margin-bottom: 6px; }
  .head p { font-size: 14px; color: var(--ink-2); }
  .entry {
    display: block; text-decoration: none; border-radius: 20px; padding: 22px 20px;
    margin-bottom: 16px; border: 1.5px solid var(--line); background: #fff;
    transition: transform .15s;
  }
  .entry:active { transform: scale(.98); }
  .entry .e-tag {
    display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 10px;
    border-radius: 999px; margin-bottom: 8px;
  }
  .entry .e-title { font-size: 19px; font-weight: 700; margin-bottom: 4px; }
  .entry .e-desc { font-size: 13px; color: var(--ink-2); }
  .entry.parent { border-color: #cfe4e1; }
  .entry.parent .e-tag { background: var(--accent-soft); color: var(--accent); }
  .entry.kid { border-color: #ffd9bd; }
  .entry.kid .e-tag { background: var(--kid-soft); color: var(--kid); }
  .foot { text-align: center; font-size: 12px; color: #98a1ad; margin-top: 28px; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin: 2px 2px 20px; }
  .top-bar .home { font-size: 13px; color: #98a1ad; text-decoration: none; }
</style>
</head>
<body data-screen-label="home">

<div class="top-bar">
  <a class="home" href="../index.html">← 小工具合集</a>
</div>

<div class="head">
  <h1>默写小工具</h1>
  <p>家长一分钟配好词库，孩子打开就能听写</p>
</div>

<a class="entry parent" href="parent.html" data-screen-label="entry-parent">
  <span class="e-tag">家长模式</span>
  <div class="e-title">给孩子布置默写</div>
  <div class="e-desc">选教材版本 / 年级 / 学科 / 单元，调好语速遍数，一键开始</div>
</a>

<a class="entry kid" href="kid.html" data-screen-label="entry-kid">
  <span class="e-tag">学生模式</span>
  <div class="e-title">开始听写</div>
  <div class="e-desc">语音播报读词，听到什么写什么，结束自动批改出成绩</div>
</a>

<p class="foot">词库与进度只保存在本机 · 语音由浏览器播报</p>

</body>
</html>
